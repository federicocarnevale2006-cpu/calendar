<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<meta name="referrer" content="no-referrer">
<title>Calendario</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f7f9;--fg:#111;--card:#fff;--line:#d9dde3;--accent:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaee;--card:#181b21;--line:#2a2f38;--accent:#60a5fa}}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
  main{max-width:360px;width:calc(100% - 32px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  h1{margin:0 0 4px;font-size:22px} p{margin:0 0 18px;opacity:.75}
  a{display:block;text-align:center;padding:12px;margin-top:10px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Calendario</h1>
  <p>App per telefono e PC.</p>
  <a href="download/Calendario.apk">Android (APK)</a>
  <a href="download/Calendario.exe">Windows (exe)</a>
