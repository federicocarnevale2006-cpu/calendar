# Compila tutto ad ogni modifica: APK per Android, installazione per Windows, versione web.
# Poi pubblica sul sito (GitHub Pages) la versione web e i file da scaricare, e crea una Release.
name: Compila
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compila
  cancel-in-progress: true

env:
  VITE_APP_VERSION: 1.0.${{ github.run_number }}
  VITE_BUILD: ${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # Prima le prove: l'app compilata viene aperta in un browser con un server finto (tests/). Se una prova non passa,
  # APK ed exe non vengono compilati ne' pubblicati.
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Browser per le prove
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm test

  android:
    needs: prove
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Chiave di firma (dai Secrets, mai nel codice)
        env:
          CAL_KS_B64: ${{ secrets.CAL_KS_B64 }}
          CAL_KS_PASS: ${{ secrets.CAL_KS_PASS }}
        run: |
          if [ -z "$CAL_KS_B64" ] || [ -z "$CAL_KS_PASS" ]; then
            echo "::error::Mancano i Secrets CAL_KS_B64 / CAL_KS_PASS: l'APK non viene firmato ne' pubblicato"; exit 1
          fi
          echo "$CAL_KS_B64" | base64 -d > android/calendario.keystore
      - name: APK
        working-directory: android
        env:
          CAL_KS_PASS: ${{ secrets.CAL_KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f calendario.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  windows:
    needs: prove
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci --no-audit --no-fund
      - name: Calendario.exe (un solo file, senza installazione)
        shell: bash
        run: |
          echo "{\"version\":\"$VITE_APP_VERSION\"}" > src-tauri/tauri.ci.json
          npx tauri build --no-bundle --config src-tauri/tauri.ci.json
          ls -la src-tauri/target/release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: src-tauri/target/release/calendario.exe

  pubblica:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Sito
        run: |
          mkdir -p site/download
          cp -r art/web/. site/
          cp art/apk/app-release.apk site/download/Calendario.apk
          cp art/exe/calendario.exe site/download/Calendario.exe
          # stesso file anche col nome vecchio: le versioni 1.0.1-1.0.3 cercano «Calendario-Setup.exe» per aggiornarsi
          cp art/exe/calendario.exe site/download/Calendario-Setup.exe
          touch site/.nojekyll
          # impronte SHA-256: l'app per PC controlla il file scaricato prima di mettersi al posto del vecchio
          EXE_SHA=$(sha256sum site/download/Calendario.exe | cut -d' ' -f1)
          APK_SHA=$(sha256sum site/download/Calendario.apk | cut -d' ' -f1)
          echo "{\"version\":\"$VITE_APP_VERSION\",\"build\":$VITE_BUILD,\"exe_sha256\":\"$EXE_SHA\",\"apk_sha256\":\"$APK_SHA\"}" > site/version.json
          cat site/version.json
          ls -la site site/download
      # prima la Release, poi il sito con version.json: quando le app vedono la versione nuova, i file ci sono gia'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VITE_APP_VERSION }}
          name: Calendario ${{ env.VITE_APP_VERSION }}
          files: |
            site/download/Calendario.apk
            site/download/Calendario.exe
            site/download/Calendario-Setup.exe
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
